[package]
name = "dirt_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Discrete Element Method simulation framework with plugin architecture"
readme = "../../README.md"
keywords = ["dem", "discrete-element", "simulation", "granular"]
categories = ["simulation", "science"]

[features]
default = ["mpi_backend", "precision-double"]
mpi_backend = ["soil_core/mpi_backend", "dirt_clump/mpi_backend"]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]

[dependencies]
grass_scheduler.workspace = true
grass_app.workspace = true
grass_derive.workspace = true
soil_core = { workspace = true, default-features = false }
soil_verlet = { workspace = true, default-features = false }
soil_print = { workspace = true, default-features = false }
dirt_atom.workspace = true
dirt_bond.workspace = true
dirt_clump.workspace = true
dirt_granular.workspace = true
dirt_wall.workspace = true
soil_derive.workspace = true
soil_deform = { workspace = true, default-features = false }
soil_fixes = { workspace = true, default-features = false }
dirt_fixes.workspace = true
dirt_measure_plane.workspace = true
dirt_contact_analysis.workspace = true
