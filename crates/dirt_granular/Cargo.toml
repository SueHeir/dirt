[package]
name = "dirt_granular"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Granular physics for DIRT: Hertz normal contact, Mindlin tangential friction, rotational dynamics"
keywords = ["dem", "hertz", "granular", "contact"]
categories = ["simulation", "science"]

[features]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]

[dependencies]
soil_core = { workspace = true, default-features = false }
grass_app.workspace = true
grass_scheduler.workspace = true
dirt_atom.workspace = true
soil_verlet = { workspace = true, default-features = false }

[dev-dependencies]
dirt_test_utils.workspace = true
