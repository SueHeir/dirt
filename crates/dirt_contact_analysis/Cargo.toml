[package]
name = "dirt_contact_analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DEM contact analysis: per-contact geometry output, coordination number, and fabric tensor"
keywords = ["dem", "contact", "force-chain", "fabric-tensor"]
categories = ["simulation", "science"]

[features]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]

[dependencies]
soil_core = { workspace = true, default-features = false }
grass_app.workspace = true
grass_scheduler.workspace = true
soil_print = { workspace = true, default-features = false }
soil_derive.workspace = true
dirt_schedule.workspace = true
dirt_atom.workspace = true
serde.workspace = true

[dev-dependencies]
dirt_test_utils.workspace = true
