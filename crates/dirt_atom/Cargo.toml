[package]
name = "dirt_atom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Per-atom DEM data (radius, density) with pack/unpack and MaterialTable for DIRT"
keywords = ["dem", "atom", "material", "simulation"]
categories = ["simulation", "science"]

[features]
precision-double = ["soil_core/precision-double"]
precision-mixed = ["soil_core/precision-mixed"]
precision-single = ["soil_core/precision-single"]

[dependencies]
soil_core = { workspace = true, default-features = false }
grass_app.workspace = true
grass_scheduler.workspace = true
soil_derive.workspace = true
serde.workspace = true
rand.workspace = true
rand_distr.workspace = true
