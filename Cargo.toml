[package]
name = "dirt-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DIRT simulation examples and binaries"
publish = false

[workspace]
members = [
  "crates/*",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/dirt"

# Dependency source of truth for every DIRT workspace member.  Individual
# manifests retain only their local feature/default-feature choices.
[workspace.dependencies]
# GRASS framework
grass_app = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
grass_derive = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
grass_scheduler = { git = "ssh://git@192.168.0.170:2222/SueHeir/grass.git", branch = "main" }
# SOIL particle substrate
# SOIL's ParticleStore row-invariant migration (b759ec4) requires a coordinated
# DIRT insertion-path update. Pin the last reviewed compatible main revision
# while that cross-repository migration lands, keeping validators reproducible.
soil_core = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4", default-features = false }
soil_deform = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4", default-features = false }
soil_derive = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4" }
soil_fixes = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4", default-features = false }
soil_print = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4", default-features = false }
soil_verlet = { git = "ssh://git@192.168.0.170:2222/SueHeir/soil.git", rev = "b759ec4", default-features = false }
# DIRT workspace members
dirt_atom = { path = "crates/dirt_atom", version = "0.1.3" }
dirt_bond = { path = "crates/dirt_bond", version = "0.1.3" }
dirt_clump = { path = "crates/dirt_clump", version = "0.1.3" }
dirt_contact_analysis = { path = "crates/dirt_contact_analysis", version = "0.1.3" }
dirt_core = { path = "crates/dirt_core", version = "0.1.3", default-features = false }
dirt_fixes = { path = "crates/dirt_fixes", version = "0.1.3" }
dirt_granular = { path = "crates/dirt_granular", version = "0.1.3" }
dirt_measure_plane = { path = "crates/dirt_measure_plane", version = "0.1.3" }
dirt_test_utils = { path = "crates/dirt_test_utils", version = "0.1.3" }
dirt_wall = { path = "crates/dirt_wall", version = "0.1.3" }
# Shared third-party crates
libffi-sys = { version = "2.3.0", features = ["system"] }
rand = "0.9"
rand_distr = "0.5.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = ["mpi_backend", "precision-double"]
mpi_backend = ["dirt_core/mpi_backend", "dep:libffi-sys"]
precision-double = ["dirt_core/precision-double"]
precision-mixed = ["dirt_core/precision-mixed"]
precision-single = ["dirt_core/precision-single"]

