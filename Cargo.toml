[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
dirt_core = { workspace = true, default-features = false }
serde.workspace = true
toml.workspace = true
dirt_clump.workspace = true
dirt_measure_plane.workspace = true
soil_derive.workspace = true
soil_deform = { workspace = true, default-features = false }
grass_scheduler.workspace = true
# Force libffi-sys to use system libffi (via pkg-config) instead of building
# from source. libffi-sys 2.3.0 has a broken aarch64 macOS assembler; Homebrew
# libffi is set via PKG_CONFIG_PATH.
libffi-sys = { workspace = true, optional = true }

