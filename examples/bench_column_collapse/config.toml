# Current-protocol representative: a = 2.0, seed = 0.
#
# Generate its exact source coordinates first:
#   python3 examples/bench_column_collapse/sweep.py generate
# This file intentionally shares the full campaign's material, 32d x 10d
# geometry, frozen rough base, and 80k/1M-step schedule.  It is not evidence
# for the 11 x 3 ensemble; only sweep.py graph can make that determination.

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.01
x_high = 0.60
y_low = -0.003
y_high = 0.0330
z_low = 0.0
z_high = 0.2480
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.1
bin_size = 0.005
every = 1

[gravity]
gx = 0.0
gy = 0.0
gz = -9.81

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.000000e+07
poisson_ratio = 0.245
restitution = 0.926
friction = 0.16

[[particles.insert]]
source = "file"
file = "examples/bench_column_collapse/sweep/rough_base.csv"
format = "csv"
material = "glass"
radius = 0.0015
density = 2500.0
columns = { x = 0, y = 1, z = 2 }

[[particles.insert]]
source = "file"
file = "examples/bench_column_collapse/sweep/a2/active_column.csv"
format = "csv"
material = "glass"
radius = 0.0015
density = 2500.0
columns = { x = 0, y = 1, z = 2 }

[[group]]
name = "rough_base"
region = { type = "block", min = [-1.0, -1.0, -1.0], max = [1.0, 1.0, 0.0037] }
dynamic = false

[[freeze]]
group = "rough_base"

[[wall]]
type = "plane"
point_z = 0.0
normal_z = 1.0
material = "glass"
name = "floor"

[[wall]]
type = "plane"
point_x = 0.0
normal_x = 1.0
material = "glass"
name = "back"

[[wall]]
type = "plane"
point_y = 0.0
normal_y = 1.0
material = "glass"
name = "side_lo"

[[wall]]
type = "plane"
point_y = 0.0300
normal_y = -1.0
material = "glass"
name = "side_hi"

[[wall]]
type = "plane"
point_x = 0.0960
normal_x = -1.0
material = "glass"
name = "gate"

[output]
dir = "examples/bench_column_collapse/sweep/a2"

[vtp]
interval = 1000000

[[run]]
name = "settle"
steps = 80000
thermo = 20000
dt = 4.000e-06

[[run]]
name = "collapse"
steps = 1000000
thermo = 20000
dt = 4.000e-06
