# Current-protocol representative: a = 2.0, seed = 0.
#
# Generate its exact source coordinates first:
#   python3 examples/bench_column_collapse/sweep.py generate
# This file intentionally shares the full campaign's material, 32d x 10d
# geometry, frozen rough base, and 800k/4M-step schedule.  It is not evidence
# for the 11 x 3 ensemble; only sweep.py graph can make that determination.

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.01
x_high = 0.60
y_low = -0.003
y_high = 0.0330
z_low = 0.0
z_high = 0.2480
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.1
bin_size = 0.005
# Displacement-driven Verlet rebuilding.  SOIL rebuilds when the 10% neighbor
# skin is consumed; unlike the former hybrid cadence, it does not force a full
# rebuild every 100 steps while the packed bed is stationary.
every = 0

[gravity]
gx = 0.0
gy = 0.0
gz = -9.81

[dem]
contact_model = "hertz"

[[dem.materials]]
# Physically identical glass reserved for the frozen rough-base membership.
# It is deliberately type 0: the dynamic `rough_base` group below is keyed by
# material type so it survives atom sorting.
name = "rough_glass"
youngs_mod = 7.000000e+07
poisson_ratio = 0.245
restitution = 0.926
friction = 0.16

[[dem.materials]]
name = "glass"
youngs_mod = 7.000000e+07
poisson_ratio = 0.245
restitution = 0.926
friction = 0.16

[[particles.insert]]
source = "file"
file = "examples/bench_column_collapse/sweep/rough_base.csv"
format = "csv"
material = "rough_glass"
radius = 0.0015
density = 2500.0
columns = { x = 0, y = 1, z = 2 }

[[particles.insert]]
source = "file"
file = "examples/bench_column_collapse/sweep/a2/active_column.csv"
format = "csv"
material = "glass"
radius = 0.0015
density = 2500.0
columns = { x = 0, y = 1, z = 2 }

[[group]]
name = "rough_base"
# DIRT material type IDs are zero-based; ``rough_glass`` is declared first.
type = [0]
dynamic = true

[[freeze]]
group = "rough_base"

# Quasi-static preparation only; bench_column_collapse removes these at the
# beginning of the collapse stage so they do not alter the measured runout.
[[cundall]]
group = "all"
gamma_l = 0.8
gamma_a = 0.8

[[nve_limit]]
group = "all"
max_displacement = 1.0e-6

[[wall]]
type = "plane"
point_z = 0.0
normal_z = 1.0
material = "glass"
name = "floor"

[[wall]]
type = "plane"
point_x = 0.0
normal_x = 1.0
material = "glass"
name = "back"

[[wall]]
type = "plane"
point_y = 0.0
normal_y = 1.0
material = "glass"
name = "side_lo"

[[wall]]
type = "plane"
point_y = 0.0300
normal_y = -1.0
material = "glass"
name = "side_hi"

[[wall]]
type = "plane"
point_x = 0.0960
normal_x = -1.0
material = "glass"
name = "gate"
# Start at the top of the rough-base beads so this gate does not load the
# frozen support that extends downstream of x=0.096 m.
bound_z_low = 0.0030

[output]
dir = "examples/bench_column_collapse/sweep/a2"

[vtp]
interval = 1000000

[[run]]
name = "settle"
steps = 800000
thermo = 20000
dt = 1.000e-06

[[run]]
name = "collapse"
steps = 4000000
thermo = 20000
dt = 1.000e-06
