# Granular-temperature conductivity κ(Φ) — BOUNDED SMOKE / CI configuration.
#
# This is the fast gate consumed by `sweep.py` with no arguments (the automated
# harness). It is a SHALLOWER, SHORTER version of the full config.toml: a smaller
# vibro-fluidized bed (800 grains, 30 mm column, 0.16 s of drive at dt = 2e-7 s)
# that still reaches a steady Φ(y), T(y) state and yields a Fourier-law
# conductivity κ(Φ) within order-unity of kinetic theory. It completes well under
# the 1800 s harness cap.
#
# It does NOT replace the scientific run: `config.toml` (3000 grains, 45 mm
# column, 4M steps at dt = 1e-7) and its κ*(Φ)-vs-KT curve are unchanged and are
# still run via `sweep.py full`. See sweep.py `smoke()` for the PASS/FAIL check.
#
# Run directly:
#   cargo run --release --example sphcal_conductivity --no-default-features --features precision-double -- examples/SPH_glass_sphere_calibration/06_conductivity/config.smoke.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.006
y_low = 0.0
y_high = 0.030      # shorter column than the full 45 mm run (fluidizes faster)
z_low = 0.0
z_high = 0.006
boundary_x = "periodic"
boundary_y = "fixed"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.0006
every = 1

[gravity]
gx = 0.0
gy = -9.81
gz = 0.0

[dem]
contact_model = "hertz"

# Canonical glass-bead material — identical to config.toml.
[[dem.materials]]
name = "glass"
youngs_mod = 7.0e7
poisson_ratio = 0.245
restitution = 0.926
friction = 0.16          # μ_p — friction's extra dissipation steepens the T(y)
                         # gradient, making κ measurable
rolling_friction = 0.10  # μ_r — canonical glass-bead rolling friction (matches full run)

[[particles.insert]]
material = "glass"
count = 800              # shallow bed (~10-layer settled) — enough for a T(y) gradient
radius = { distribution = "uniform", min = 0.000225, max = 0.000275 }
density = 2500.0
region = { type = "block", min = [0.0, 0.001, 0.0], max = [0.006, 0.024, 0.006] }
seed = 12345

# Oscillating base wall — same drive as the full run (Γ_vib ≈ 26, well fluidized).
[[wall]]
type = "plane"
point_y = 0.0
normal_y = 1.0
material = "glass"
name = "base"
oscillate = { amplitude = 0.00025, frequency = 160.0 }

# Static top wall (bed should not reach it).
[[wall]]
type = "plane"
point_y = 0.030
normal_y = -1.0
material = "glass"
name = "top"

[output]
dir = "examples/SPH_glass_sphere_calibration/06_conductivity/data/smoke"

[vtp]
interval = 200000

# The shallow bed reaches steady fluidization quickly; ~0.16 s (≈ 26 vibration
# cycles) at the relaxed smoke timestep. sweep.py averages the last half.
[[run]]
name = "fluidize"
steps = 800000           # bounded (vs 4,000,000 in config.toml)
thermo = 20000
dt = 2.0e-7              # shallow bed tolerates a larger dt than the deep full run
