# Approximately one-hour, eight-rank through-thickness pull of the polished
# TANGLE fake felt. Runtime depends on the machine and evolving contact count.

[comm]
processors_x = 2
processors_y = 2
processors_z = 2

[domain]
x_low = 0.00000000000000000e0
x_high = 1.00000004749745131e-3
boundary_x = "periodic"
y_low = 0.00000000000000000e0
y_high = 1.00000004749745131e-3
boundary_y = "periodic"
# Fixed DIRT faces are deletion boundaries. Keep 100 um of tensile headroom
# beyond each compacted specimen face so the prescribed grips remain owned.
z_low = 1.85883434116840363e-4
z_high = 1.37016380429267883e-3
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.2
bin_size = 9.77908959566023227e-5
every = 20

[dem]
contact_model = "hertz"
tangential_model = "linear_nohistory"

[[dem.materials]]
name = "7 um stiff fiber"
youngs_mod = 1.0e9
poisson_ratio = 0.25
restitution = 0.3
friction = 0.3

[[dem.materials]]
name = "19 um bendy fiber"
youngs_mod = 1.0e9
poisson_ratio = 0.25
restitution = 0.3
friction = 0.3

[[particles.insert]]
source = "file"
file = "../tangle/examples/fake_felted/output/cleanup_capsules.data"
format = "lammps_data"
atom_style = "bpm/sphere"
material = "7 um stiff fiber"
type_map = { "1" = "7 um stiff fiber", "2" = "19 um bendy fiber" }

[capsule]
file = "../tangle/examples/fake_felted/output/cleanup_capsules.data"

[bonds]
file = "../tangle/examples/fake_felted/output/cleanup_capsules.data"
format = "lammps_data"
auto_bond = false
bond_radius_ratio = 1.0
ghost_cutoff_multiplier = 4.0
youngs_modulus = 1.0e9
shear_modulus = 4.0e8
bending_modulus = 1.0e9
twist_modulus = 4.0e8
beta_normal = 0.5
beta_shear = 0.5
beta_bending = 0.5
beta_twist = 0.5

[output]
dir = "examples/fake_felted_tension/output"

[dump]
# 100 MPI-gathered frames over 400,000 steps. Each file is directly readable
# by OVITO and the generated dump/view_spherocylinders.py builds a saved session.
interval = 4000
format = "ovito_spherocylinder"
per_rank = false
ghost = false

[run]
steps = 400000
thermo = 10000
dt = 5.0e-10
