# Matched two-million-step, 50% through-thickness pull of the needled fake
# felt. Mechanical and numerical settings match the unneedled control.

[comm]
processors_x = 4
processors_y = 2
processors_z = 2

[domain]
x_low = 0.00000000000000000e0
x_high = 1.00000004749745131e-3
boundary_x = "periodic"
y_low = 0.00000000000000000e0
y_high = 1.00000004749745131e-3
boundary_y = "periodic"
z_low = -8.72892394196242100e-5
z_high = 1.59699252774007618e-3
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.2
bin_size = 9.77909628927362858e-5
every = 20

[dem]
contact_model = "hertz"
tangential_model = "linear_nohistory"

[[dem.materials]]
name = "7 um stiff fiber"
youngs_mod = 1.0e9
poisson_ratio = 0.25
restitution = 0.3
friction = 0.3

[[dem.materials]]
name = "19 um bendy fiber"
youngs_mod = 1.0e9
poisson_ratio = 0.25
restitution = 0.3
friction = 0.3

[[particles.insert]]
source = "file"
file = "../tangle/examples/fake_felted/output/needled_capsules.data"
format = "lammps_data"
atom_style = "bpm/sphere"
material = "7 um stiff fiber"
type_map = { "1" = "7 um stiff fiber", "2" = "19 um bendy fiber" }

[capsule]
file = "../tangle/examples/fake_felted/output/needled_capsules.data"

[bonds]
file = "../tangle/examples/fake_felted/output/needled_capsules.data"
format = "lammps_data"
auto_bond = false
bond_radius_ratio = 1.0
ghost_cutoff_multiplier = 4.0
youngs_modulus = 1.0e9
shear_modulus = 4.0e8
bending_modulus = 1.0e9
twist_modulus = 4.0e8
beta_normal = 0.5
beta_shear = 0.5
beta_bending = 0.5
beta_twist = 0.5

[output]
dir = "examples/fake_needled_tension/output_50pct"

[dump]
interval = 20000
format = "ovito_spherocylinder"
per_rank = false
ghost = false

[run]
steps = 2000000
thermo = 10000
dt = 5.0e-10
