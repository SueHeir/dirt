# Declarative bounded automation gate for bench_angle_of_repose.
#
# The full validation remains in sweep.py full: 6 friction values x 3 packs,
# optional LAMMPS overlay, reproducibility checks, and committed plots. The
# automation harness invokes sweep.py with no argument, which reads this file and
# runs a fast deterministic trend gate under the harness wall-clock cap.

[smoke]
# Coarse span: frictionless collapse -> mid-friction slope -> high friction.
# Keep mu=0.3 in the bounded gate: it is the hardest mid-friction smoke point and
# catches the toe-fit regression that made the full curve non-physical.
mu_list = [0.0, 0.3, 0.5]

# A small deterministic ensemble keeps the gate bounded while testing the same
# mean-theta quantity as the full validation. The full run still owns the wider
# 6-mu sweep, optional LAMMPS overlay, and reproducibility-spread tolerance.
reps = 3
seed = 12345
