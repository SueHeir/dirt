# peri_dem_interop — peridynamics (pond) + DEM (dirt) on ONE shared soil substrate.
#
# Two identical brittle glass bars sit on the x-axis, separated by a gap wider
# than the peridynamic horizon (so their bond families never cross — they are two
# independent specimens). Bar A is launched at the resting bar B. On impact the
# unbonded A–B interface atoms interact through DEM contact (dirt); the resulting
# compressive wave reflects off each free far end as tension and SPALLS a fragment
# off each bar (peridynamic bond breakage). Every force is internal, so the total
# mass and momentum of the whole system are conserved across the peri→DEM
# transition — the hard acceptance gate, checked live by the example.
#
# Bond-based PD force law + s0 = sqrt(5 G0 / 9 K delta) are dev_soil_peri's (peri_bond /
# peri_atom; Silling & Askari, Comput. Struct. 83 (2005) 1526). The DEM tier is
# dirt's real Hertz–Mindlin contact. Both ride soil's Atom / neighbour list /
# BondStore.
#
# Run (single process):
#   cargo run --release --example peri_dem_interop \
#       --no-default-features --features precision-double -- \
#       examples/peri_dem_interop/config.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
# Box comfortably larger than the swept region so nothing reaches a wall.
x_low = -0.030
x_high = 0.070
y_low = -0.004
y_high = 0.008
z_low = -0.004
z_high = 0.008
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
# Neighbour cutoff comes from each point's cutoff_radius (= horizon = 3 mm).
# Rebuild every step so the moving bar's new inter-bar contacts are seen promptly.
skin_fraction = 1.2
bin_size = 0.0032
every = 1

# DEM material (index 0) — soda-lime glass. Used by dirt's Hertz–Mindlin contact.
[[dem.materials]]
name = "glass"
youngs_mod = 72.0e9        # Pa
poisson_ratio = 0.3
restitution = 0.6
friction = 0.3

# Peridynamic tier (bond-based PD). One brittle material shared by both bars.
[interop]
spacing = 0.001            # dx = 1 mm  → cell volume dx^3
horizon = 0.003            # delta = 3*dx
youngs_mod = 72.0e9        # E [Pa]  (soda-lime glass)
density = 2440.0           # rho [kg/m^3]
fracture_energy = 135.0    # G0 [J/m^2]  → s0 = sqrt(5 G0 / 9 K delta) ≈ 7.2e-4
radius_scale = 0.5         # DEM sphere radius = 0.5*dx (touching lattice)

# Bar A: 20 x 4 x 4 points, launched toward +x at 100 m/s.
[[interop.bars]]
min = [0.0, 0.0, 0.0]
max = [0.020, 0.004, 0.004]
velocity = [100.0, 0.0, 0.0]

# Bar B: 20 x 4 x 4 points, initially at rest. Nearest-point gap to A is
# (0.023+0.5dx) - (0.020-0.5dx) = 0.0035 m = 3.5*dx > horizon, so no cross-bar
# bonds form at setup.
[[interop.bars]]
min = [0.023, 0.0, 0.0]
max = [0.043, 0.004, 0.004]
velocity = [0.0, 0.0, 0.0]

[vtp]
interval = 200            # VTP visualization dumps (watch the spall + contact)

[[run]]
name = "impact"
dt = 2.0e-8               # s  (below the PD stable limit dx/c0 ≈ 1.8e-7 s)
steps = 3000
thermo = 200
