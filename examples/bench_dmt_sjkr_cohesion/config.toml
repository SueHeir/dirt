# DMT / SJKR Cohesion Benchmark — default single-run config (DMT arm).
#
# Two identical glass spheres. The left sphere is frozen; the right sphere is
# launched slowly inward with adhesion_model = "dmt". DMT adds a *constant*
# attractive force F_dmt = 2*pi*w*R* on top of Hertz contact, with NO extended
# (gap) interaction range — so the pull-off is realized inside geometric overlap
# and the net normal force F_n(delta) = (4/3)E*sqrt(R*) delta^1.5 - F_dmt is most
# tensile as delta -> 0. restitution = 1 removes velocity damping so the normal
# force is conservative and the delta->0 intercept is exactly -2*pi*w*R*.
#
# The full sweep (both DMT and SJKR arms) is driven by sweep.py; this file is the
# single-case smoke test used by run-bench.sh.
#
# Run: cargo run --release --example bench_dmt_sjkr_cohesion --no-default-features \
#        --features precision-double -- examples/bench_dmt_sjkr_cohesion/config.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.05
x_high = 0.05
y_low = -0.02
y_high = 0.02
z_low = -0.02
z_high = 0.02
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.1
bin_size = 0.02
every = 1

[dem]
contact_model = "hertz"
adhesion_model = "dmt"        # DMT -> pull-off F = 2*pi*w*R* (JKR would be 1.5*pi*w*R*)

[[dem.materials]]
name = "glass"
youngs_mod = 70.0e9           # Pa — soda-lime glass
poisson_ratio = 0.22
restitution = 1.0             # no normal damping -> conservative contact force
friction = 0.0                # pure normal pull-off
surface_energy = 0.5          # w = work of adhesion [J/m^2]

# Left sphere — frozen. Center at x = 0.
[[particles.insert]]
material = "glass"
count = 1
radius = 0.005
density = 2500.0
region = { type = "block", min = [-1.0e-6, -1.0e-6, -1.0e-6], max = [1.0e-6, 1.0e-6, 1.0e-6] }

# Right sphere — free, launched inward (-x). Center separation 0.01105 > 1.1*diam
# so it inserts cleanly; slow inward velocity so the contact is finely resolved.
[[particles.insert]]
material = "glass"
count = 1
radius = 0.005
density = 2500.0
velocity_x = -0.002
region = { type = "block", min = [0.0110499, -1.0e-6, -1.0e-6], max = [0.0110501, 1.0e-6, 1.0e-6] }

# Freeze the left sphere. dynamic = false pins membership at start.
[[group]]
name = "frozen"
dynamic = false
region = { type = "block", min = [-0.002, -0.002, -0.002], max = [0.002, 0.002, 0.002] }

[[freeze]]
group = "frozen"

[output]
dir = "examples/bench_dmt_sjkr_cohesion"

[run]
steps = 1200000
thermo = 200000
