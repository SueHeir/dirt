# run/shear_box.toml — Lees–Edwards simple-shear box, driven DECLARATIVELY.
#
# A triperiodic cell of glass beads (gravity off) is sheared at a constant
# engineering shear-strain rate γ̇ up to a target total strain. The loading is
# described — not scripted — by the single [loading] block at the bottom:
#
#     [loading]
#     type          = "shear"     # Lees–Edwards xy simple shear
#     rate          = 100.0       # γ̇ (1/s)
#     target_strain = 1.0         # stop at γ = 1.0
#     dt            = 2.0e-7       # s
#
# The RUNNER interprets that spec: it derives the step count
# (steps = ceil(target_strain / (|rate|·dt)) = 50000) and owns the step loop
# that carries the box to the target strain. There is NO user-authored [[run]]
# schedule and NO [deform] block here — loading is declarative.
#
#   cargo run --release --example run -- examples/run/shear_box.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
# Fully periodic cell. Lees–Edwards shear: flow = x, gradient = y, vorticity = z.
# xy simple shear requires periodic x and y.
x_low = 0.0
x_high = 0.006
y_low = 0.0
y_high = 0.006
z_low = 0.0
z_high = 0.006
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.0007          # >= largest particle diameter (2 * 0.000275 m)
every = 1

[gravity]
gx = 0.0
gy = 0.0
gz = 0.0                   # OFF — homogeneous simple shear, no body force

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.0e7        # softened from ~65 GPa real glass (rigid-grain limit)
poisson_ratio = 0.245
restitution = 0.926       # measured glass–glass COR
friction = 0.16           # measured glass–glass sliding μ_p

# --- glass pack: ~1000 mildly polydisperse beads, Φ ≈ 0.30 in the 6 mm cell ---
[[particles.insert]]
material = "glass"
count = 1000
radius = { distribution = "uniform", min = 0.000225, max = 0.000275 }
density = 2500.0
velocity = 0.02           # small initial agitation to break the insertion lattice
region = { type = "block", min = [0.0, 0.0, 0.0], max = [0.006, 0.006, 0.006] }
seed = 12345

# --- standard dump output ---
[dump]
interval = 10000          # per-atom LAMMPS-dump snapshots (box header + atoms)
format = "lammps"

[vtp]
interval = 10000          # VTP visualization frames

# --- DECLARATIVE loading: the runner owns the step loop ---
[loading]
type = "shear"            # Lees–Edwards xy simple shear
rate = 100.0              # engineering shear-strain rate γ̇ (1/s)
target_strain = 1.0       # dimensionless total strain to reach (γ = 1.0)
dt = 2.0e-7               # s  → runner derives steps = 1.0 / (100·2e-7) = 50000
