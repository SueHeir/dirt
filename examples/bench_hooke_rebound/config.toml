# Hooke (linear-spring) Normal-Contact Rebound Benchmark
# Two identical spheres launched head-on along x collide once and rebound via
# the LINEAR spring-dashpot contact (contact_model = "hooke", kn/kt), NOT Hertz.
#
# The linear contact is a constant-coefficient damped harmonic oscillator, so it
# has an EXACT closed-form collision: the coefficient of restitution equals the
# input `restitution`, and the contact duration / peak overlap follow from the
# damped-oscillator solution. sweep.py gates the run against that analytical
# theory (independent of DIRT and of any other code).
#
# Run:
#   cargo run --release --example bench_hooke_rebound --no-default-features \
#       --features precision-double -- examples/bench_hooke_rebound/config.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.02
x_high = 0.02
y_low = -0.01
y_high = 0.01
z_low = -0.01
z_high = 0.01
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.1
bin_size = 0.015          # >= particle diameter (0.01 m)
every = 1

[dem]
contact_model = "hooke"   # linear spring-dashpot (the path under test)
# No tensile cutoff, so the damping acts through the whole half-period exactly as
# in the analytical damped-oscillator solution (COR = input restitution). With
# the default clamp (limit_damping = true) the near-separation damping impulse is
# removed and the realized COR rises above the linear-theory value.
limit_damping = false

[[dem.materials]]
name = "grain"
youngs_mod = 7.0e10       # Pa — unused by the Hooke normal path (kn set directly)
poisson_ratio = 0.30      # unused by the Hooke normal path
restitution = 0.8         # coefficient of restitution — EXACT for a linear spring
friction = 0.0            # normal-only rebound (no tangential force)
kn = 1.0e5                # N/m — linear normal spring stiffness (Hooke)
kt = 2.857e4              # N/m — linear tangential spring stiffness (2/7 kn)

# Sphere A: launched in +x from the left.
[[particles.insert]]
material = "grain"
count = 1
radius = 0.005
density = 2500.0
velocity_x = 0.5
region = { type = "block", min = [-0.006001, -1.0e-6, -1.0e-6], max = [-0.005999, 1.0e-6, 1.0e-6] }

# Sphere B: launched in -x from the right.
[[particles.insert]]
material = "grain"
count = 1
radius = 0.005
density = 2500.0
velocity_x = -0.5
region = { type = "block", min = [0.005999, -1.0e-6, -1.0e-6], max = [0.006001, 1.0e-6, 1.0e-6] }

[output]
dir = "examples/bench_hooke_rebound"

[run]
steps = 30000
dt = 1.0e-7
thermo = 100000
