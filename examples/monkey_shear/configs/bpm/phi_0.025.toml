# monkey_shear — bpm (bonded 44-sphere monkey) | Φ = 0.025 | N = 191 | D_eq = 0.1
# Constant-volume Lees-Edwards simple shear. Final box 2x2x1 (vol 4.0),
# fully periodic: flow=x, gradient=y, vorticity=z. Insertion box scaled x1.0000
# (aspect 2:2:1 preserved), then erate-compressed to the final box (skipped if s=1).
# dt=6.31e-07s, gdot=1.0 s^-1, shear strain target ~2. 8404 sub-spheres, gap 1.25x(Ri+Rj).
# GENERATED by tools/gen_series.py — declarative config, do not hand-edit.

[domain]
x_low = -0.000025
x_high = 2.000025
y_low = -0.000025
y_high = 2.000025
z_low = -0.000012
z_high = 1.000012
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.05966
every = 1

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.0e+07
poisson_ratio = 0.245
restitution = 0.926
friction = 0.16

[[particles.insert]]
source = "file"
file = "examples/monkey_shear/configs/bpm/phi_0.025.csv"
format = "csv"
material = "glass"
density = 2500.0
columns = { x = 0, y = 1, z = 2, radius = 3 }

[bonds]
auto_bond = true
bond_tolerance = 1.1
bond_radius_ratio = 1.0
youngs_modulus = 7.0000e+07
shear_modulus  = 2.8112e+07
# Critical damping (β=1) on all four channels keeps the welded monkey quasi-rigid:
# it bleeds the sheared cantilever/arm-tip bond modes that otherwise resonate.
beta_normal  = 1.0
beta_shear   = 1.0
beta_twist   = 1.0
beta_bending = 1.0
# No [bonds.breakage] table => bonds are UNBREAKABLE (elastic) for this campaign.

[[run]]
name = "settle"
steps = 20000
thermo = 2000
dt = 6.314e-07

[[run]]
name = "compress"
steps = 6
thermo = 2000
dt = 1.579e-06
deform = { x = { style = "erate", rate = -2.592311e+00 }, y = { style = "erate", rate = -2.592311e+00 }, z = { style = "erate", rate = -2.592311e+00 } }

[[run]]
name = "shear"
steps = 3167459
thermo = 2000
dt = 6.314e-07
deform = { xy = { style = "erate", rate = 1.0 } }

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[gravity]
gx = 0.0
gy = 0.0
gz = 0.0

[output]
dir = "examples/monkey_shear/data/bpm/phi_0.025"

[vtp]
interval = 100000000
