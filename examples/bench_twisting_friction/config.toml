# Twisting-friction spin-down benchmark — validates the twisting (torsional)
# friction torque against its EXACT analytical spin-down rate.
#
# Two identical spheres are stacked along +z. The LOWER sphere is a frozen
# anchor ([[freeze]] — cannot translate or spin), the UPPER sphere rests on it
# under gravity and is given a pure twisting spin ω = (0,0,ω0) about the contact
# normal n̂ = +ẑ. A pure twist has zero contact-point slip, so the only contact
# torque is the twisting couple τ_tw = μ_tw·F_n·r_eff. With F_n = m g,
# r_eff = R/2 (equal spheres) and I = (2/5) m R², the spin decays at the exact
# constant rate
#
#     α = dω/dt = (5/4)·μ_tw·g/R.
#
# The upper sphere's seating (static Hertz overlap ⇒ F_n = m g) and its initial
# spin are set in main.rs (no omega knob in [[particles.insert]]). This standalone
# config runs the default constant-torque case; sweep.py generates the μ_tw sweep
# and the SDS variant.
#
# Run:
#   cargo run --release --example bench_twisting_friction --no-default-features --features precision-double -- examples/bench_twisting_friction/config.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.05
x_high = 0.05
y_low = -0.05
y_high = 0.05
z_low = 0.0
z_high = 0.05
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.1
bin_size = 0.02
every = 1

[gravity]
gz = -9.81

[dem]
contact_model = "hertz"
twisting_model = "constant"   # the model under test ("constant" or "sds")

[[dem.materials]]
name = "grain"
youngs_mod = 1.0e8        # Pa — soft (keeps dt large; the decay rate is E-independent)
poisson_ratio = 0.3
restitution = 0.3         # damps the tiny normal settling transient quickly
friction = 0.0            # off — a pure twist has no tangential slip anyway
twisting_friction = 0.1   # μ_tw — swept by sweep.py

# Lower sphere: frozen anchor at (0,0,0.010). R = 5 mm.
[[particles.insert]]
material = "grain"
count = 1
radius = 0.005
density = 2500.0
region = { type = "block", min = [-1.0e-6, -1.0e-6, 0.0099990], max = [1.0e-6, 1.0e-6, 0.0100010] }

# Upper sphere: the twisting mover, inserted just above the anchor. main.rs seats
# it at the exact static overlap and sets the spin at step 0.
[[particles.insert]]
material = "grain"
count = 1
radius = 0.005
density = 2500.0
region = { type = "block", min = [-1.0e-6, -1.0e-6, 0.0199970], max = [1.0e-6, 1.0e-6, 0.0199990] }

# Group + freeze on the lower sphere only (region hugs z = 0.010).
[[group]]
name = "anchor"
region = { type = "block", min = [-0.002, -0.002, 0.008], max = [0.002, 0.002, 0.012] }

[[freeze]]
group = "anchor"

[output]
dir = "examples/bench_twisting_friction"

[run]
steps = 80000
thermo = 20000
dt = 1.0e-5
