# Representative declarative rod-shear case (AR=2). The validation sweep writes
# per-aspect-ratio configs under sweep/ and runs those.
[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.008
y_low = 0.0
y_high = 0.008
z_low = 0.0
z_high = 0.008
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.00096
every = 1

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 87000000.0
poisson_ratio = 0.3
restitution = 0.9
friction = 0.0

[[clump.definitions]]
name = "rod_ar2"
spheres = [
    { offset = [-3.1748021039e-04, 0.0, 0.0], radius = 3.1748021039e-04 },
    { offset = [ 3.1748021039e-04, 0.0, 0.0], radius = 3.1748021039e-04 },
]

[[clump.insert]]
definition = "rod_ar2"
count = 19
density = 2500.0
material = "glass"
velocity = 0.04
random_orientation = true
seed = 1002
region = { type = "block", min = [0.0006667084, 0.0006667084, 0.0006667084], max = [0.0073332916, 0.0073332916, 0.0073332916] }

[output]
dir = "examples/bench_rod_shear_aspect_ratio/data/ar2"

[[run]]
name = "settle"
steps = 2000
thermo = 1000
dt = 2e-07

[[run]]
name = "shear"
steps = 30000
thermo = 1000
dt = 2e-07
deform = { xy = { style = "erate", rate = 100.0 } }
