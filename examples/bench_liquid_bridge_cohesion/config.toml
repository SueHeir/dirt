[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = -0.01
x_high = 0.02
y_low = -0.01
y_high = 0.01
z_low = -0.01
z_high = 0.01
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.3
bin_size = 0.006
every = 1

[dem]
contact_model = "hertz"
liquid_bridge_model = "willett2000"

[[dem.materials]]
name = "glass"
youngs_mod = 1.0e6
poisson_ratio = 0.25
restitution = 1.0
friction = 0.0
liquid_bridge_volume = 1.0e-11
liquid_surface_tension = 0.072
liquid_contact_angle = 0.0
liquid_rupture_distance = 1.5e-4

[[particles.insert]]
material = "glass"
count = 1
radius = 0.002
density = 2500.0
region = { type = "block", min = [-1.0e-7, -1.0e-7, -1.0e-7], max = [1.0e-7, 1.0e-7, 1.0e-7] }

[[particles.insert]]
material = "glass"
count = 1
radius = 0.002
density = 2500.0
velocity_x = 0.06
region = { type = "block", min = [0.0040009, -1.0e-7, -1.0e-7], max = [0.0040011, 1.0e-7, 1.0e-7] }

[[group]]
name = "frozen"
dynamic = false
region = { type = "block", min = [-0.001, -0.001, -0.001], max = [0.001, 0.001, 0.001] }

[[freeze]]
group = "frozen"

[output]
dir = "examples/bench_liquid_bridge_cohesion"

[run]
steps = 200
thermo = 100
