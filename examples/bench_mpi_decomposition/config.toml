# bench_mpi_decomposition — contact-rich frictional gas for MPI cross-rank
# correctness.
#
# A dense, fully-periodic box of ~400 frictional glass spheres given a seeded
# Gaussian velocity field. They collide and cool (restitution < 1), so at any
# step there are many live frictional contacts carrying tangential spring
# history in the per-contact ContactHistoryStore. With gravity OFF and a
# periodic box, the ONLY thing that changes between a 1×1×1 run and a 2×1×1 /
# 2×2×1 run is the domain decomposition: ghost exchange, atom migration across
# rank boundaries, and the order in which pairwise/ghost forces are reduced.
# A correct decomposition reproduces the single-rank trajectory to the
# floating-point associativity floor and conserves global momentum, energy, and
# atom count exactly.
#
# EVERYTHING BELOW THE "SWEEP CONTROL" MARKER (comm grid / output / dump / run)
# is rewritten per-run by sweep.py, which composes the 1×1×1, 2×1×1 and 2×2×1
# variants. The default block at the bottom exists only so this config is
# runnable standalone for development. Keep the marker line intact.

[domain]
x_low = 0.0
x_high = 0.02
y_low = 0.0
y_high = 0.02
z_low = 0.0
z_high = 0.02
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.0022          # >= largest particle diameter (0.002 m)
# Rebuild the neighbor list every step and disable the cache-locality re-sort so
# the ONLY difference between the single-rank and multi-rank runs is the domain
# decomposition itself. The rebuild schedule and the atom re-sort are local,
# per-rank heuristics whose timing would otherwise differ between decompositions
# and change the (physics-identical) pairwise-summation ORDER, injecting ~1e-16
# associativity noise that a chaotic granular gas amplifies. Pinning them (like
# LAMMPS `neigh_modify every 1 check no`) removes that confound WITHOUT changing
# the physics, isolating exactly what the decomposition must preserve: the
# per-atom state and per-contact history carried across rank boundaries.
every = 1
check = false
sort_every = 0

# Gravity OFF: no external force. With a periodic box the total linear momentum
# is then an exact invariant (contact forces are equal-and-opposite pairs), so
# any momentum drift is a cross-rank ghost-force bug, not physics.
[gravity]
gx = 0.0
gy = 0.0
gz = 0.0

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.0e7        # softened glass (canonical soft-sphere DEM value)
poisson_ratio = 0.245     # glass
restitution = 0.9         # < 1 so the gas cools and contacts dissipate
friction = 0.3            # frictional -> tangential spring history is exercised

# ~400 spheres, radius 0.001 m -> solid fraction ~0.21 (dense: many contacts
# live at any instant). Seeded insertion + seeded Gaussian velocity make the
# initial condition reproducible bit-for-bit across every decomposition.
[[particles.insert]]
material = "glass"
count = 400
radius = 0.001
density = 2500.0
velocity = 0.2            # Gaussian sigma per component (seeded)
region = { type = "block", min = [0.0015, 0.0015, 0.0015], max = [0.0185, 0.0185, 0.0185] }
seed = 20260704

# === SWEEP CONTROL BELOW: sweep.py replaces everything after this marker ===
[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[output]
dir = "examples/bench_mpi_decomposition/data/standalone"

[dump]
interval = 0
format = "binary"

[[run]]
name = "standalone"
dt = 1.0e-6
steps = 1000
thermo = 500
save_at_end = true
