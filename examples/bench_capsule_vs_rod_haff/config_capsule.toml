# Haff cooling — single-body sphero-cylinder (capsule) gas
# ========================================================
# A periodic box of single capsule particles, random initial velocity, no gravity.
# The granular temperature should decay following Haff's law, exactly as the
# rod-of-spheres clump gas does (config_rod.toml) — that is the comparison.
#
#   CAPSULE_VS_ROD_MODE=capsule cargo run --release \
#     --example bench_capsule_vs_rod_haff --no-default-features --features precision-double \
#     -- examples/bench_capsule_vs_rod_haff/config_capsule.toml

[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.04
y_low = 0.0
y_high = 0.04
z_low = 0.0
z_high = 0.04
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.1
bin_size = 0.005

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.0e7
poisson_ratio = 0.245
restitution = 0.9
friction = 0.3

# Capsule: r = 0.5 mm, cylindrical L = 3 mm → tip-to-tip 4 mm, aspect ratio 4.
[[capsule.definitions]]
name = "rod4"
radius = 0.0005
length = 0.003

[[capsule.insert]]
definition = "rod4"
count = 400
density = 2500.0
material = "glass"
velocity = 0.5
random_orientation = true
seed = 1
region = { type = "block", min = [0.003, 0.003, 0.003], max = [0.037, 0.037, 0.037] }

[output]
dir = "examples/bench_capsule_vs_rod_haff/data"

[run]
steps = 400000
thermo = 20000
