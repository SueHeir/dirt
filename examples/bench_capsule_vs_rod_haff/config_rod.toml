# Haff cooling — rod-of-spheres (multisphere clump) gas, matched to config_capsule.toml
# 7 overlapping spheres (r=0.5mm) spanning a 3mm cylinder → tip-to-tip 4mm, aspect ~4.
[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.04
y_low = 0.0
y_high = 0.04
z_low = 0.0
z_high = 0.04
boundary_x = "periodic"
boundary_y = "periodic"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.1
bin_size = 0.005

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "glass"
youngs_mod = 7.0e7
poisson_ratio = 0.245
restitution = 0.9
friction = 0.3

[[clump.definitions]]
name = "rod4"
spheres = [
    { offset = [-0.0015, 0.0, 0.0], radius = 0.0005 },
    { offset = [-0.0010, 0.0, 0.0], radius = 0.0005 },
    { offset = [-0.0005, 0.0, 0.0], radius = 0.0005 },
    { offset = [ 0.0000, 0.0, 0.0], radius = 0.0005 },
    { offset = [ 0.0005, 0.0, 0.0], radius = 0.0005 },
    { offset = [ 0.0010, 0.0, 0.0], radius = 0.0005 },
    { offset = [ 0.0015, 0.0, 0.0], radius = 0.0005 },
]

[[clump.insert]]
definition = "rod4"
count = 400
density = 2500.0
material = "glass"
velocity = 0.5
random_orientation = true
seed = 1
region = { type = "block", min = [0.003, 0.003, 0.003], max = [0.037, 0.037, 0.037] }

[output]
dir = "examples/bench_capsule_vs_rod_haff/data"

[run]
steps = 400000
thermo = 20000
