# Guo et al. (AIChE J. 65(1), 2019) normal-stress-fixed wall cell.
# `run_case.py` materializes the deterministic 500-fiber, 17-bead input before run.
[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.064
y_low = 0.0
y_high = 0.050
z_low = 0.0
z_high = 0.064
boundary_x = "fixed"
boundary_y = "fixed"
boundary_z = "fixed"

[neighbor]
skin_fraction = 1.2
bin_size = 0.004
every = 1

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "rubber_cord"
youngs_mod = 6.28e6
poisson_ratio = 0.3
restitution = 0.5
friction = 1.4

[[particles.insert]]
source = "file"
file = "examples/bench_guo2018_fiber_shear_cell/generated/pack.csv"
format = "csv"
material = "rubber_cord"
radius = 0.0012
density = 1157.5
columns = { x = 0, y = 1, z = 2 }

[bonds]
auto_bond = false
file = "examples/bench_guo2018_fiber_shear_cell/generated/pack.bonds"
format = "lammps_data"
bond_radius_ratio = 1.0
youngs_modulus = 6.28e6
shear_modulus = 2.415384615e6
beta_normal = 1.0
beta_shear = 1.0
beta_twist = 1.0
beta_bending = 1.0

[[wall]]
type = "cylinder"
axis = "y"
center = [0.032, 0.032]
radius = 0.032
inside = true
material = "rubber_cord"
name = "cylindrical_sidewall"

[[wall]]
type = "plane"
point_y = 0.0
normal_y = 1.0
material = "rubber_cord"
name = "lower_drive"
velocity = [0.0, 0.0, 0.0]

[[wall]]
type = "plane"
# The executable holds this lid at its initial height while the loose packing
# settles under gravity, then enables the servo. This prevents a descending
# lid from chasing the free-falling bed.
point_y = 0.050
normal_y = -1.0
material = "rubber_cord"
name = "normal_load_lid"
# The 50 mm/s cap is 0.012 micrometre per reported DEM step, below the particle radius.
# After the explicit 100,000-step gravity-settle stage, the remaining run
# budget establishes the force-controlled state before shearing begins.
servo = { target_force = 1.499904, max_velocity = 0.050, gain = 1.0e-1 }

[gravity]
gx = 0.0
gy = -9.81
gz = 0.0

[output]
dir = "examples/bench_guo2018_fiber_shear_cell/generated"

[[run]]
name = "settle_normal_load_and_shear"
# The executable controls the stage transition. At 20 mm/s and a 50-mm initial
# gap, gamma = 0.5 needs 1.25 s after the 100,000-step settle stage.
steps = 6100000
thermo = 10000
dt = 2.3e-7
