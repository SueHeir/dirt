# Guo et al. (doi:10.1002/aic.16397), Computational Set-up, pp. 5--8.
# This is the published *planar periodic* DEM reduction, not the SRST annulus.
[comm]
processors_x = 1
processors_y = 1
processors_z = 1

[domain]
x_low = 0.0
x_high = 0.064
y_low = 0.0
y_high = 0.060
z_low = 0.0
z_high = 0.036
boundary_x = "periodic"
boundary_y = "fixed"
boundary_z = "periodic"

[neighbor]
skin_fraction = 1.2
bin_size = 0.004
every = 1

[dem]
contact_model = "hertz"

[[dem.materials]]
name = "rubber_cord"
youngs_mod = 6.28e6
poisson_ratio = 0.3
restitution = 0.5
friction = 1.4

[[particles.insert]]
source = "file"
file = "examples/bench_guo2018_fiber_shear_cell/generated/pack.csv"
format = "csv"
material = "rubber_cord"
radius = 0.0012
density = 1157.5
columns = { x = 0, y = 1, z = 2 }

[bonds]
auto_bond = false
file = "examples/bench_guo2018_fiber_shear_cell/generated/pack.bonds"
format = "lammps_data"
bond_radius_ratio = 1.0
youngs_modulus = 6.28e6
shear_modulus = 2.415384615e6
beta_normal = 1.0
beta_shear = 1.0
beta_twist = 1.0
beta_bending = 1.0

# Plates plus paired, finite vertical-plane faces.  The latter represent the
# 4-mm lid and 2-mm base blades; `main.rs` keeps each array registered to its
# moving plate.  Centres are 8 mm apart in x, as stated by the paper.
[[wall]]
type = "plane"
point_y = 0.0
normal_y = 1.0
material = "rubber_cord"
name = "lower_drive"
velocity = [0.0, 0.0, 0.0]

[[wall]]
type = "plane"
point_y = 0.050
normal_y = -1.0
material = "rubber_cord"
name = "normal_load_lid"
servo = { target_force = 1499.904, max_velocity = 0.050, gain = 1.0e-1 }

[[wall]]
type = "plane"
point_x = 0.008
normal_x = 1.0
bound_y_low = 0.0
bound_y_high = 0.002
bound_z_low = 0.0
bound_z_high = 0.036
material = "rubber_cord"
name = "lower_blades_pos"

[[wall]]
type = "plane"
point_x = 0.008
normal_x = -1.0
bound_y_low = 0.0
bound_y_high = 0.002
bound_z_low = 0.0
bound_z_high = 0.036
material = "rubber_cord"
name = "lower_blades_neg"

[[wall]]
type = "plane"
point_x = 0.008
normal_x = 1.0
bound_y_low = 0.046
bound_y_high = 0.050
bound_z_low = 0.0
bound_z_high = 0.036
material = "rubber_cord"
name = "upper_blades_pos"

[[wall]]
type = "plane"
point_x = 0.008
normal_x = -1.0
bound_y_low = 0.046
bound_y_high = 0.050
bound_z_low = 0.0
bound_z_high = 0.036
material = "rubber_cord"
name = "upper_blades_neg"

[output]
dir = "examples/bench_guo2018_fiber_shear_cell/generated"

[[run]]
name = "settle_normal_load_and_shear"
steps = 6100000
thermo = 10000
dt = 2.3e-7
