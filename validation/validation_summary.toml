# Declarative descriptors for the auto-generated validation summary dashboard.
#
# This file is CONFIG, not code: it names, for every `bench_*` example, WHAT is
# validated and AGAINST WHAT — the parts a human must assert because they cannot
# be measured from a run (the reference source, its evidence type, the checked
# quantity, and the tolerance the bench enforces).
#
# The dynamic, drift-prone facts — the latest MEASURED value and the PASS/FAIL
# verdict — are NOT written here. They are read from the real benchmark run
# outputs by `validation/gen_validation_summary.py`, which regenerates
# `docs/src/reference/validation-summary.md`. That separation is the whole point:
# the "how closely, right now" columns are machine-generated from actual results
# so they cannot silently drift from what the code does.
#
# `measure` (optional) is a Python regex applied to the newest run log; its first
# capture group becomes the "latest measured value" cell (labelled by
# `measure_label`). When it is absent or does not match, the generator falls back
# to the run's own verdict string (e.g. "46/46 checks passed"). Either way the
# value comes from the run, never from this file.
#
# `reference_type` uses the evidence tiers documented in
# docs/src/reference/validation.md and examples/VALIDATION.md:
#   analytical | cross-code | empirical | experimental | numerical
# (and honest combinations, e.g. "analytical + cross-code").
#
# Every `examples/bench_*` directory MUST have an entry here; the generator fails
# loudly if a benchmark is added or removed without updating this manifest, so the
# dashboard can never silently omit a benchmark.

[bench.bench_hertz_rebound]
reference = "Hertz normal contact (Johnson, Contact Mechanics 1985) + LAMMPS gran/hertz"
reference_type = "analytical + cross-code"
quantity = "COR, contact time t_c, peak overlap δ_max; DIRT-vs-LAMMPS realized COR"
tolerance = "δ_max ≤0.1% & t_c ~1–2% at elastic anchor; |ΔCOR| vs LAMMPS ≤0.005"
measure_label = "max |ΔCOR| vs LAMMPS"
measure = 'Max \|DIRT - LAMMPS\| COR = ([0-9.]+)'

[bench.bench_oblique_impact]
reference = "Maw–Barber–Fawcett (1976) tangential-restitution curve + LAMMPS granular"
reference_type = "analytical + cross-code"
quantity = "tangential restitution β(ψ₁) across the full Maw S-curve"
tolerance = "max |Δβ| vs LAMMPS ≲0.02"
measure_label = "max |Δβ| vs LAMMPS"
measure = 'max \|d_beta\| = ([0-9.]+)'

[bench.bench_kharaz_oblique]
reference = "Kharaz, Gorham & Salman (2001) protocol: rigid-body kinematics + Maw, anchored to measured eₙ=0.98, μ=0.092"
reference_type = "experimental (anchored) + analytical"
quantity = "normal restitution eₙ, rebound angle, non-dim rebound spin vs incidence angle"
tolerance = "eₙ flat at 0.980 across sweep; sliding-branch kinematics to 3 dp"
measure_label = "eₙ (flat)"
measure = 'e_n=([0-9.]+)  mu='

[bench.bench_sliding_friction]
reference = "rigid-body slip-to-roll mechanics (a=μg, t*=2v₀/7μg, v_f=5/7·v₀)"
reference_type = "analytical"
quantity = "sliding decel a, transition time t*, final rolling speed v_f (μ-independent)"
tolerance = "a 8%, v_final 3%, t* 10%"

[bench.bench_rolling_decay]
reference = "constant-torque rolling-resistance rate a=(5/7)μ_r g (r_eff/R) + LAMMPS rolling sds"
reference_type = "analytical (self-consistent)"
quantity = "fitted rolling deceleration vs μ_r; pure-rolling slip"
tolerance = "slope ≤2% rel, slip ≤1% of v₀"

[bench.bench_jkr_adhesion]
reference = "JKR pull-off force F=(3/2)πwR*"
reference_type = "analytical (self-consistent)"
quantity = "pull-off force linearity in work-of-adhesion w"
tolerance = "≤0.001% on F; linear-fit R²≈1"
measure_label = "linear-fit slope err"
measure = 'slope \(theory\):.*\(err=([0-9.]+%)\)'

[bench.bench_dmt_sjkr_cohesion]
reference = "DMT pull-off F=2πwR* and SJKR area-law F_coh=cπR*δ (with DMT/JKR ratio 4/3)"
reference_type = "analytical (self-consistent)"
quantity = "DMT pull-off, SJKR cohesion slope, and the 4/3 model-selection ratio"
tolerance = "≤0.1% on each closed form; linearity R²≈1"

[bench.bench_fiber_crossover]
reference = "Coulomb sliding limit F_slide=μN at a bonded-fiber crossover"
reference_type = "analytical (self-consistent)"
quantity = "sliding force vs normal load (recovers μ)"
tolerance = "recovered μ within ~0.06 of 0.4"
measure_label = "fitted μ (expect 0.4)"
measure = 'Fitted slope F_slide = m\*N : m = ([0-9.]+)'

[bench.bench_polydisperse_mixing]
reference = "per-pair mixing rules R*=r₁r₂/(r₁+r₂), E*, e_ij=√(e₁e₂), μ_ij=√(μ₁μ₂)"
reference_type = "analytical (self-consistent)"
quantity = "mixed-pair Hertz overlap/duration, COR mixing, oblique friction impulse ratio"
tolerance = "≤0.1% (elastic overlap); ΔCOR ≤0.001; friction ratio ≤5%"
measure_label = "checks passed"
measure = 'Overall: ([0-9]+/[0-9]+) checks passed'

[bench.bench_sphere_haff_cooling]
reference = "Haff's cooling law T_g=T₀/(1+t/tc)² (t⁻² late-time) + LAMMPS"
reference_type = "analytical (law) + cross-code"
quantity = "linearity of 1/√T in t (R²) and late-time cooling slope → −2"
tolerance = "R² ≥0.999; slope approaching −2 as t/tc grows"
measure_label = "Haff-law R²"
measure = 'Haff law \(1/sqrt\(T\) linear\)\s*PASS\s*R\^2=([0-9.]+)'

[bench.bench_clump_haff_cooling]
reference = "Haff's cooling law (7-sphere clumps) + LAMMPS (calibrated, past rotational transient)"
reference_type = "analytical (law) + cross-code"
quantity = "linearity of 1/√T in t (R²) and late-time cooling slope → −2"
tolerance = "R² ≥0.999; slope approaching −2 as t/tc grows"
measure_label = "Haff-law R²"
measure = 'Haff law \(1/sqrt\(T\) linear\)\s*PASS\s*R\^2=([0-9.]+)'

[bench.bench_rod_haff_cooling]
reference = "Haff's cooling law (4-sphere asymmetric rods) + LAMMPS"
reference_type = "analytical (law) + cross-code"
quantity = "linearity of 1/√T in t (R²) and late-time cooling slope → −2"
tolerance = "R² ≥0.999; slope approaching −2 as t/tc grows"
measure_label = "Haff-law R²"
measure = 'Haff law \(1/sqrt\(T\) linear\)\s*PASS\s*R\^2=([0-9.]+)'

[bench.bench_angle_of_repose]
reference = "empirical trend (no exact analytical repose angle)"
reference_type = "empirical (qualitative)"
quantity = "repose angle vs sliding friction: monotone rise, μ=0 near-flat, reproducible"
tolerance = "qualitative — trend, sign, and reproducibility only"

[bench.bench_column_collapse]
reference = "Lube (2004) & Lajeunesse (2004) experimental runout scalings"
reference_type = "empirical (scaling)"
quantity = "runout exponent (L_f−L₀)/L₀ vs aspect ratio, linear and power regimes"
tolerance = "fitted exponents within ±0.25 of 1.0 (a≤3) and 2/3 (a≥3)"
measure_label = "linear-regime exponent (target 1.0)"
measure = 'Linear regime \(a <= 3.0\): fitted exponent = ([0-9.]+)'

[bench.bench_hopper_beverloo]
reference = "Beverloo empirical correlation W ∝ (D−k·d)^(3/2)"
reference_type = "empirical (correlation)"
quantity = "fitted discharge-rate exponent vs orifice width"
tolerance = "exponent 1.5 ± 0.35; log–log R² ≥0.95"
measure_label = "fitted exponent (target 1.5)"
measure = 'fitted exponent = ([0-9.]+) within'

[bench.bench_plate_sinkage]
reference = "Bekker terramechanics relation p=(k_c/b+k_φ)·zⁿ"
reference_type = "empirical (qualitative)"
quantity = "pressure–sinkage power-law exponent n"
tolerance = "n within [0.4, 1.6]; R² ≥0.85"

[bench.bench_convergence]
reference = "self-convergence to finest-dt / large-N limit, anchored by exact elastic Hertz"
reference_type = "numerical (self-convergence)"
quantity = "dt- and N-convergence of observables; observed order of accuracy p"
tolerance = "default dt within ~3%; t_c plateau |Δ| ≤10%; observed p≈2"
measure_label = "checks passed"
measure = '([0-9]+/[0-9]+) checks passed'

[bench.bench_lebc_shear]
reference = "steady simple-shear rheology (μ(I) law) under Lees–Edwards boundaries"
reference_type = "analytical (law)"
quantity = "steady stress ratio μ=|σ_xy|/P and stress-drift stationarity"
tolerance = "0.15 ≤ μ ≤ 0.9, P>0, steady-state drift <15%"
measure_label = "checks passed"
measure = '([0-9]+/[0-9]+) checks passed'

[bench.bench_granular_conductivity]
reference = "kinetic-theory (Lun/Gidaspow) granular conductivity κ*_KT"
reference_type = "analytical (law)"
quantity = "Fourier-law κ*_EB vs kinetic-theory κ*_KT ratio (median)"
tolerance = "median κ*_EB/κ*_KT within [0.4, 6.0]; ≥2 resolvable T-gradient bins"
measure_label = "median κ*_EB/κ*_KT"
measure = 'median κ\*_EB/κ\*_KT = ([0-9.]+) in'

[bench.bench_bond_breakage]
reference = "crack-band breakage closed form + Guo trilinear peak moment M^p=(4/3)σ₀r_b³"
reference_type = "analytical"
quantity = "crack-band breakage strain and trilinear peak bending moment"
tolerance = "crack-band rel 8% (abs floor 5e-4); peak moment rel 6%"
measure_label = "checks"
measure = 'RESULT: (ALL CHECKS PASSED|[0-9]+/[0-9]+ checks passed|CHECKS? FAILED)'

[bench.bench_chung_ooi_impact]
reference = "Chung & Ooi (2011) elastic-impact benchmark tests 1 & 2 (Hertz closed form)"
reference_type = "analytical"
quantity = "peak force F_max, contact time t_c, peak overlap δ_max vs Hertz"
tolerance = "err ≲1% on F_max, t_c, δ_max across the velocity sweep"
measure_label = "checks passed"
measure = 'Overall: ([0-9]+/[0-9]+) checks passed'

[bench.bench_twisting_friction]
reference = "constant-torque twisting-friction spin-down rate α=(5/4)μ_tw g/R"
reference_type = "analytical (self-consistent)"
quantity = "fitted twisting spin-down rate vs μ_tw; off-axis spin and drift"
tolerance = "slope ≤3% rel, ω_perp ≤0.1% of ω₀, drift ≤10 µm"

[bench.bench_restart_determinism]
reference = "bitwise checkpoint/restart continuity and run-to-run determinism"
reference_type = "numerical (determinism)"
quantity = "restart-vs-uninterrupted position/velocity continuity; byte-identical dumps"
tolerance = "continuity ≤1e-9 relative; dumps byte-for-byte identical"
measure_label = "checks passed"
measure = 'Result: ([0-9]+/[0-9]+) checks passed'
